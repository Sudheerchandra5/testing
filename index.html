<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Paint — Draw with touch or mouse</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="title-bar">
      <span class="title">Paint</span>
      <div class="title-actions">
        <button type="button" id="btn-undo" class="title-btn" title="Undo" disabled>↶ Undo</button>
        <button type="button" id="btn-download" class="title-btn" title="Save image">💾 Save</button>
      </div>
    </header>

    <aside class="toolbar" aria-label="Drawing tools">
      <button type="button" class="tool active" data-tool="brush" title="Brush">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 2L22 4L11 15L7 11L20 2Z" fill="currentColor"/><path d="M7 11L3 15L2 22L9 21L13 17" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span>Brush</span>
      </button>
      <button type="button" class="tool" data-tool="pencil" title="Pencil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21L9 15L15 21H3Z" fill="currentColor"/><path d="M9 15L3 9L12 3L21 12L15 18" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span>Pencil</span>
      </button>
      <button type="button" class="tool" data-tool="eraser" title="Eraser">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="14" width="14" height="6" rx="1" fill="currentColor"/><path d="M6 14L14 6L20 12L12 20H6V14Z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span>Eraser</span>
      </button>
      <button type="button" class="tool" data-tool="line" title="Line">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="20" x2="20" y2="4" stroke="currentColor" stroke-width="2"/></svg>
        <span>Line</span>
      </button>
      <button type="button" class="tool" data-tool="rect" title="Rectangle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="14" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <span>Rect</span>
      </button>
      <button type="button" class="tool" data-tool="circle" title="Circle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <span>Circle</span>
      </button>
      <button type="button" class="tool" data-tool="fill" title="Fill background">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 11H5M19 11C20.1 11 21 11.9 21 13V19C21 20.1 20.1 21 19 21H5C3.9 21 3 20.1 3 19V13C3 11.9 3.9 11 5 11M9 7V5C9 3.9 9.9 3 11 3H13C14.1 3 15 3.9 15 5V7" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="7" y="11" width="10" height="10" fill="currentColor" opacity="0.3"/></svg>
        <span>Fill</span>
      </button>
      <button type="button" class="tool danger" id="btn-clear" title="Clear canvas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6H5H21" stroke="currentColor" stroke-width="2"/><path d="M8 6V4C8 3.4 8.4 3 9 3H15C15.6 3 16 3.4 16 4V6M19 6V20C19 20.6 18.6 21 18 21H6C5.4 21 5 20.6 5 20V6H19Z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span>Clear</span>
      </button>
    </aside>

    <main class="workspace">
      <div class="options-bar">
        <label class="option">
          <span>Size</span>
          <input type="range" id="brush-size" min="1" max="80" value="8" />
          <output id="brush-size-label">8</output>
        </label>
        <div class="color-section">
          <span class="option-label">Colors</span>
          <div class="palette" id="palette" role="listbox" aria-label="Color palette"></div>
          <label class="custom-color">
            <span>Custom</span>
            <input type="color" id="custom-color" value="#000000" />
          </label>
          <div class="color-preview" id="color-preview" title="Current color"></div>
        </div>
      </div>

      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="canvas" aria-label="Drawing canvas"></canvas>
        <p class="hint" id="hint">Draw with your finger, mouse, or stylus</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
